    <style>

        background: #000;

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-one-collection", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 6);
        tl.fromTo("#el-02-whole-library", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 6);
        tl.to("#el-02-whole-library", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-03-one-lifecycle", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to("#el-03-one-lifecycle", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 20);
        tl.fromTo("#el-04-watch", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 20);
        tl.to("#el-04-watch", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 29);
        tl.fromTo("#el-05-read-your-way", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 29);

        tl.fromTo("#el-06-read-and-listen", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 40);
        tl.to("#el-06-read-and-listen", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 46);
        tl.fromTo("#el-07-listen", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 46);
        tl.to("#el-07-listen", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 53);
        tl.fromTo("#el-08-every-screen", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 53);
        tl.to("#el-08-every-screen", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 60);
        tl.fromTo("#el-09-every-medium", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 60);
        tl.to("#el-09-every-medium", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 66);
        tl.fromTo("#el-10-self-host-it", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 66);
        tl.to({}, { duration: 72 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
