  <div id="root" data-composition-id="01-one-collection" data-start="0" data-duration="6.4" data-width="1920" data-height="1080">

    <img id="f01-one-collection-prism" class="clip" data-frame-part="01-one-collection-prism" data-start="0" data-duration="6.4" data-track-index="1" src="assets/prism-refraction-hero.webp" alt="" />

      <div data-frame-part="01-one-collection-line" data-frame-state="01-one-collection-first">
        <span>ONE</span><span>COLLECTION.</span>
      </div>
      <div data-frame-part="01-one-collection-line" data-frame-state="01-one-collection-second" aria-hidden="true">

    <div data-frame-part="01-one-collection-final-line" aria-label="One private home.">
      <span data-frame-part="01-one-collection-final-text" data-layout-allow-occlusion data-layout-allow-overflow>ONE PRIVATE HOME.</span>
    </div>
  </div>

  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-one-collection"]');
      const firstLine = root.querySelector('[data-frame-state="01-one-collection-first"]');
      const secondLine = root.querySelector('[data-frame-state="01-one-collection-second"]');
      const firstWords = Array.from(firstLine.querySelectorAll('span'));
      const secondWords = Array.from(secondLine.querySelectorAll('span'));
      const labels = root.querySelector('[data-frame-part="01-one-collection-handoff-labels"]');
      const prism = root.querySelector('[data-frame-part="01-one-collection-prism"]');
      const shroud = root.querySelector('[data-frame-part="01-one-collection-shroud"]');
      const hairline = root.querySelector('[data-frame-part="01-one-collection-hairline"]');
      const finalText = root.querySelector('[data-frame-part="01-one-collection-final-text"]');

      // Content-paced word windows are computed once, keeping each phrase's reveal deterministic.
      const wordWindows = (words, start, pace) => words.reduce((windows, word) => {
        const previous = windows[windows.length - 1];
        const at = previous ? previous.end + pace.gap : start;
        const duration = pace.base + word.textContent.length * pace.perCharacter;
        windows.push({ word, start: at, end: at + duration });
        return windows;
      }, []);
      const firstWindows = wordWindows(firstWords, 0.08, { base: 0.2, perCharacter: 0.025, gap: 0.13 });
      const secondWindows = wordWindows(secondWords, 1.46, { base: 0.16, perCharacter: 0.018, gap: 0.09 });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines['01-one-collection'] = tl;

      gsap.set(secondLine, { autoAlpha: 0 });
      gsap.set(labels, { autoAlpha: 0 });
      gsap.set(finalText, { x: -840 });
      gsap.set(hairline, { autoAlpha: 0 });

      firstWindows.forEach(({ word, start, end }) => {
        tl.fromTo(word, { autoAlpha: 0, y: 42, filter: 'blur(11px)' }, {
          autoAlpha: 1,
          y: 0,
          filter: 'blur(0px)',
          duration: end - start,
          ease: 'power3.out',
        }, start);
      });

      // Scene 2: a direct state cut followed by a downward waterfall entrance at the same anchor.
      tl.set(firstLine, { autoAlpha: 0 }, 1.4);
      tl.set(secondLine, { autoAlpha: 1 }, 1.4);
      secondWindows.forEach(({ word, start, end }) => {
        tl.fromTo(word, { autoAlpha: 0, y: -112, filter: 'blur(18px)' }, {
          autoAlpha: 1,
          y: 0,
          filter: 'blur(0px)',
          duration: end - start,
          ease: 'power4.out',
        }, start);
      });
      tl.fromTo(labels, { autoAlpha: 0, y: -18 }, {
        autoAlpha: 0.46,
        y: 0,
        duration: 0.17,
        ease: 'none',
      }, 1.68);
      tl.set(labels, { autoAlpha: 0 }, 2.18);

      // Scene 3: the real optical image rises from silhouette to the sole spectrum payoff.
      tl.set(secondLine, { autoAlpha: 0 }, 2.8);
      tl.to(prism, { opacity: 1, duration: 1.14, ease: 'power2.inOut' }, 2.8);
      tl.to(shroud, { opacity: 0.06, duration: 1.14, ease: 'power2.inOut' }, 2.8);

      // Scene 4: the final copy is a clean left-to-right masked reveal, then a still hold.
      tl.fromTo(hairline, { autoAlpha: 0, scaleX: 0 }, {
        autoAlpha: 1,
        scaleX: 1,
        duration: 0.18,
        ease: 'power2.out',
      }, 4.68);
      tl.to(finalText, { x: 0, duration: 0.56, ease: 'power3.out' }, 4.75);
    })();
  </script>
