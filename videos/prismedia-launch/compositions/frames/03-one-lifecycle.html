  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });
    const surface = document.getElementById("03-one-lifecycle-surface");
    const claim = document.getElementById("03-one-lifecycle-claim");
    const focus = document.getElementById("03-one-lifecycle-focus");
    const hook = document.getElementById("03-one-lifecycle-target-hook");
    const continuity = document.getElementById("03-one-lifecycle-continuity");
    const payoff = document.getElementById("03-one-lifecycle-payoff");
    const segments = [1, 2, 3, 4].map((index) => document.getElementById(`03-one-lifecycle-segment-${index}`));

    tl.fromTo(surface, { y: 42, opacity: 0 }, { y: 0, opacity: 1, duration: 1.35, ease: "power3.out" }, 0);
    tl.fromTo(claim, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "power3.out" }, 0.42);

    const lifecycle = [
      { id: 0, word: "DISCOVER", segment: 1 },
      { id: 1, word: "ACQUIRE", segment: 2 },
      { id: 2, word: "IDENTIFY", segment: 3 },
      { id: 3, word: "ENJOY", segment: 4 },
      { id: 4, word: "MAINTAIN", segment: null },
    ];
    const baseDuration = 0.31;
    const secondsPerCharacter = 0.035;
    const availableSequence = 2.78;
    const rawDurations = lifecycle.map((entry) => baseDuration + entry.word.length * secondsPerCharacter);
    const timingScale = availableSequence / rawDurations.reduce((total, duration) => total + duration, 0);
    let cursor = 2.28;
    const lifecycleTimeline = lifecycle.map((entry, index) => {
      const duration = rawDurations[index] * timingScale;
      const timed = { ...entry, start: cursor, end: cursor + duration };
      cursor += duration;
      return timed;
    });

    lifecycleTimeline.forEach((entry) => {
      const term = document.getElementById(`03-one-lifecycle-term-${entry.id}`);
      tl.fromTo(term, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "power3.out" }, entry.start);
      if (entry.segment) {
        const segment = document.getElementById(`03-one-lifecycle-segment-${entry.segment}`);
        tl.fromTo(segment, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.31, ease: "power2.out" }, entry.end - 0.1);
      }
    });

    tl.fromTo(focus, { opacity: 0 }, { opacity: 0.78, duration: 0.18, ease: "none" }, 3.74);
    tl.to(focus, { opacity: 0, duration: 0.28, ease: "none" }, 4.18);

    tl.addLabel("same-item", 5.2);
    lifecycleTimeline.forEach((entry) => {
      const term = document.getElementById(`03-one-lifecycle-term-${entry.id}`);
      tl.to(term, { scaleY: 0.04, opacity: 0.22, duration: 0.42, ease: "power2.inOut" }, "same-item");
    });
    tl.to(segments, { scaleX: 0, opacity: 0, duration: 0.42, ease: "power2.inOut" }, "same-item");
    tl.fromTo(continuity, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.62, ease: "power2.inOut" }, "same-item");
    tl.fromTo(hook, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.62, ease: "power2.inOut" }, "same-item");
    tl.fromTo(payoff, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, "same-item+=0.36");

    window.__timelines["03-one-lifecycle"] = tl;
  </script>
